name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --pre-fix resolves a merge-base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # The segmenter is an OPTIONAL dependency of the skill, so it is an
      # optional dependency of this job too. Both steps below are deliberately
      # non-fatal: if the wheel is unavailable or Google's bucket is down, the
      # segmentation checks SKIP, and a skip never counts as a pass in this
      # suite. A red build caused by somebody else's outage teaches nothing.
      - name: Install segmentation runtime (optional)
        run: pip install ai-edge-litert || echo "no wheel for this platform — segmentation checks will skip"

      - name: Fetch segmentation weights (optional)
        run: |
          dir=skills/lightroom-editor/scripts/models
          file="$dir/selfie_multiclass_256x256.tflite"
          url=https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          mkdir -p "$dir"
          if curl -sSfL --retry 3 --max-time 180 -o "$file" "$url"; then
            size=$(wc -c < "$file")
            echo "fetched $size bytes"
            # -f already refuses HTTP errors, but a truncated or redirected
            # body saved under a .tflite name would fail at load time instead
            # of skipping cleanly, which is the worse failure. ~16 MB expected.
            if [ "$size" -lt 1000000 ]; then
              echo "too small to be the model — discarding so the checks skip"
              rm -f "$file"
            fi
          else
            echo "fetch failed — segmentation checks will skip, which is not a pass"
          fi

      - name: Skill regression suite
        run: python tests/test_skill.py

      - name: Leak check
        run: ./scripts/leak-check.sh

      - name: Validate every XMP in the repo
        run: |
          shopt -s nullglob globstar
          files=(**/*.xmp)
          if [ ${#files[@]} -gt 0 ]; then
            python skills/lightroom-editor/scripts/preset-check.py "${files[@]}"
          else
            echo "no .xmp files tracked in the repo — nothing to validate"
          fi
        shell: bash
